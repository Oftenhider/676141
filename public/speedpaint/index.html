<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>676141.xyz - Speedpaint</title>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <main class="game-shell">
      <h1>Speedpaint</h1>

      <div class="toolbar">
        <span id="status">Upload an image to begin.</span>
        <span>Time: <strong id="timer">3.00</strong>s</span>
        <span>Score: <strong id="scoreValue">--</strong></span>
      </div>

      <div class="paint-controls">
        <label for="imageUpload" class="main-link upload-label">Upload image</label>
        <input id="imageUpload" type="file" accept="image/*">
        <button id="clearPaint" class="paint-button" type="button" disabled>Clear</button>
        <button id="sharePaint" class="paint-button" type="button" disabled>Share</button>
        <a class="main-link" href="/">Back to main</a>
      </div>

      <div class="paint-layout">
        <div class="canvas-card">
          <p>Target</p>
          <canvas id="targetCanvas" class="paint-canvas" width="260" height="260" aria-label="Target image"></canvas>
        </div>

        <div class="canvas-card">
          <p>Your drawing</p>
          <canvas id="drawCanvas" class="paint-canvas" width="260" height="260" aria-label="Drawing canvas"></canvas>
        </div>
      </div>
    </main>

    <script>
      (function() {
        const maxDimension = 260;
        const maxDurationMs = 3000;

        const imageUpload = document.getElementById('imageUpload');
        const targetCanvas = document.getElementById('targetCanvas');
        const drawCanvas = document.getElementById('drawCanvas');
        const clearPaintButton = document.getElementById('clearPaint');
        const sharePaintButton = document.getElementById('sharePaint');
        const statusElement = document.getElementById('status');
        const timerElement = document.getElementById('timer');
        const scoreElement = document.getElementById('scoreValue');

        const targetCtx = targetCanvas.getContext('2d', { willReadFrequently: true });
        const drawCtx = drawCanvas.getContext('2d', { willReadFrequently: true });

        let gameActive = false;
        let roundArmed = false;
        let startTime = 0;
        let timerFrame = null;
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let imageReady = false;
        let lastScore = null;

        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';
        drawCtx.lineWidth = 8;
        drawCtx.strokeStyle = '#111';
        drawCanvas.style.touchAction = 'none';

        function clearCanvas() {
          drawCtx.fillStyle = '#fff';
          drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
        }

        function prepareCanvases(image) {
          const width = maxDimension;
          const height = maxDimension;
          const imageScale = Math.min(width / image.naturalWidth, height / image.naturalHeight);
          const imageWidth = image.naturalWidth * imageScale;
          const imageHeight = image.naturalHeight * imageScale;
          const imageX = (width - imageWidth) / 2;
          const imageY = (height - imageHeight) / 2;

          targetCanvas.width = width;
          targetCanvas.height = height;
          drawCanvas.width = width;
          drawCanvas.height = height;

          targetCtx.fillStyle = '#fff';
          targetCtx.fillRect(0, 0, width, height);
          targetCtx.drawImage(image, imageX, imageY, imageWidth, imageHeight);

          clearCanvas();

          imageReady = true;
          roundArmed = true;
          clearPaintButton.disabled = false;
          sharePaintButton.disabled = true;
          lastScore = null;
          timerElement.textContent = '3.00';
          scoreElement.textContent = '--';
          statusElement.textContent = 'Image loaded. Draw in black; the timer starts on first touch.';
          drawCtx.lineWidth = Math.max(4, Math.round(Math.max(width, height) / 28));
          setBoardInteractivity(true);
        }

        function setBoardInteractivity(enabled) {
          if (enabled) {
            drawCanvas.style.pointerEvents = 'auto';
          } else {
            drawCanvas.style.pointerEvents = 'none';
          }
        }

        function stopRound(autoScore) {
          if (!gameActive) return;

          gameActive = false;
          roundArmed = false;
          isDrawing = false;
          setBoardInteractivity(false);
          if (timerFrame) {
            cancelAnimationFrame(timerFrame);
            timerFrame = null;
          }

          if (!autoScore) return;

          const score = calculateScore();
          lastScore = score;
          scoreElement.textContent = `${score}/100`;
          statusElement.textContent = `Time's up. Score: ${score}/100`;
          sharePaintButton.disabled = false;
        }

        function updateTimer(now) {
          if (!gameActive) return;

          const elapsed = now - startTime;
          const left = Math.max(0, maxDurationMs - elapsed);
          timerElement.textContent = (left / 1000).toFixed(2);

          if (left <= 0) {
            stopRound(true);
            return;
          }

          timerFrame = requestAnimationFrame(updateTimer);
        }

        function startRound() {
          if (!imageReady || gameActive || !roundArmed) return;

          gameActive = true;
          roundArmed = false;
          statusElement.textContent = 'Draw now for 3 seconds.';
          setBoardInteractivity(true);
          startTime = performance.now();
          timerElement.textContent = '3.00';
          timerFrame = requestAnimationFrame(updateTimer);
        }

        function getPoint(event) {
          const rect = drawCanvas.getBoundingClientRect();
          const scaleX = drawCanvas.width / rect.width;
          const scaleY = drawCanvas.height / rect.height;

          return {
            x: (event.clientX - rect.left) * scaleX,
            y: (event.clientY - rect.top) * scaleY
          };
        }

        function drawStart(event) {
          if (!imageReady || (!gameActive && !roundArmed)) return;
          if (!gameActive && roundArmed) {
            startRound();
          }
          if (!gameActive) return;

          const point = getPoint(event);
          isDrawing = true;
          lastX = point.x;
          lastY = point.y;
          drawCtx.beginPath();
          drawCtx.moveTo(lastX, lastY);
          drawCtx.lineTo(lastX, lastY);
          drawCtx.stroke();
        }

        function drawMove(event) {
          if (!isDrawing || !gameActive) return;

          const point = getPoint(event);
          drawCtx.beginPath();
          drawCtx.moveTo(lastX, lastY);
          drawCtx.lineTo(point.x, point.y);
          drawCtx.stroke();
          lastX = point.x;
          lastY = point.y;
        }

        function drawEnd() {
          if (!isDrawing) return;

          isDrawing = false;
        }

        function calculateScore() {
          const width = targetCanvas.width;
          const height = targetCanvas.height;

          if (!width || !height) {
            return 0;
          }

          const targetData = targetCtx.getImageData(0, 0, width, height).data;
          const drawData = drawCtx.getImageData(0, 0, width, height).data;
          const pixelCount = width * height;
          const columns = 16;
          const rows = Math.max(8, Math.round(columns * height / width));
          const cellCount = columns * rows;
          const targetTone = new Float64Array(cellCount);
          const drawTone = new Float64Array(cellCount);
          const samples = new Uint32Array(cellCount);
          let targetMass = 0;
          let drawMass = 0;
          let grayError = 0;
          let drawnInkPixels = 0;

          for (let y = 0; y < height; y += 1) {
            const cellY = Math.min(rows - 1, Math.floor(y * rows / height));

            for (let x = 0; x < width; x += 1) {
              const pixel = (y * width + x) * 4;
              const cellX = Math.min(columns - 1, Math.floor(x * columns / width));
              const cell = cellY * columns + cellX;
              const targetGray =
                (0.2126 * targetData[pixel] +
                  0.7152 * targetData[pixel + 1] +
                  0.0722 * targetData[pixel + 2]) /
                255;
              const drawGray =
                (0.2126 * drawData[pixel] +
                  0.7152 * drawData[pixel + 1] +
                  0.0722 * drawData[pixel + 2]) /
                255;
              const targetDarkness = 1 - targetGray;
              const drawDarkness = 1 - drawGray;

              targetTone[cell] += targetDarkness;
              drawTone[cell] += drawDarkness;
              samples[cell] += 1;
              targetMass += targetDarkness;
              drawMass += drawDarkness;
              grayError += Math.abs(targetGray - drawGray);
              if (drawDarkness > 0.08) {
                drawnInkPixels += 1;
              }
            }
          }

          const minimumInk = Math.max(35, Math.floor(pixelCount * 0.002));
          if (drawnInkPixels < minimumInk || drawMass < pixelCount * 0.001) {
            return 0;
          }

          for (let cell = 0; cell < cellCount; cell += 1) {
            if (samples[cell] > 0) {
              targetTone[cell] /= samples[cell];
              drawTone[cell] /= samples[cell];
            }
          }

          function makeEdges(values) {
            const edges = new Float64Array(cellCount);

            for (let row = 0; row < rows; row += 1) {
              for (let column = 0; column < columns; column += 1) {
                const cell = row * columns + column;
                const right = row * columns + Math.min(columns - 1, column + 1);
                const below = Math.min(rows - 1, row + 1) * columns + column;
                edges[cell] = Math.min(
                  1,
                  (Math.abs(values[cell] - values[right]) +
                    Math.abs(values[cell] - values[below])) *
                    1.8
                );
              }
            }

            return edges;
          }

          function softDice(first, second) {
            let overlap = 0;
            let total = 0;

            for (let i = 0; i < first.length; i += 1) {
              overlap += Math.min(first[i], second[i]);
              total += first[i] + second[i];
            }

            return total > 0.0001 ? (2 * overlap) / total : 0;
          }

          function correlation(first, second) {
            let firstMean = 0;
            let secondMean = 0;

            for (let i = 0; i < first.length; i += 1) {
              firstMean += first[i];
              secondMean += second[i];
            }

            firstMean /= first.length;
            secondMean /= second.length;

            let covariance = 0;
            let firstVariance = 0;
            let secondVariance = 0;

            for (let i = 0; i < first.length; i += 1) {
              const firstDifference = first[i] - firstMean;
              const secondDifference = second[i] - secondMean;
              covariance += firstDifference * secondDifference;
              firstVariance += firstDifference * firstDifference;
              secondVariance += secondDifference * secondDifference;
            }

            const denominator = Math.sqrt(firstVariance * secondVariance);
            return denominator > 0.000001 ? Math.max(0, covariance / denominator) : 0;
          }

          const targetEdges = makeEdges(targetTone);
          const drawEdges = makeEdges(drawTone);
          const toneMatch = softDice(targetTone, drawTone);
          const edgeMatch = softDice(targetEdges, drawEdges);
          const layoutMatch = correlation(targetTone, drawTone);
          const grayMatch = Math.max(0, 1 - grayError / pixelCount);
          const massBalance =
            targetMass > 0.001 && drawMass > 0.001
              ? Math.min(targetMass, drawMass) / Math.max(targetMass, drawMass)
              : 0;
          const activityPenalty = Math.min(1, drawnInkPixels / Math.max(1, pixelCount * 0.012));

          const combined =
            0.31 * toneMatch +
            0.31 * edgeMatch +
            0.24 * layoutMatch +
            0.14 * grayMatch;
          const strictAccuracy =
            Math.pow(Math.max(0, combined), 1.35) *
            (0.78 + 0.22 * massBalance) *
            activityPenalty;

          return Math.max(0, Math.min(100, Math.round((strictAccuracy / 0.88) * 100)));
        }
        function shareScore() {
          if (lastScore === null) return;

          const exportCanvas = document.createElement('canvas');
          const exportCtx = exportCanvas.getContext('2d');
          const cardWidth = 1000;
          const cardHeight = 650;
          const imageSize = 380;
          const imageY = 170;
          exportCanvas.width = cardWidth;
          exportCanvas.height = cardHeight;

          exportCtx.fillStyle = '#1e1e2e';
          exportCtx.fillRect(0, 0, cardWidth, cardHeight);
          exportCtx.fillStyle = '#cdd6f4';
          exportCtx.font = '700 52px "Trebuchet MS", sans-serif';
          exportCtx.fillText('SPEEDPAINT', 60, 78);
          exportCtx.font = '700 72px "Trebuchet MS", sans-serif';
          exportCtx.textAlign = 'right';
          exportCtx.fillText(`${lastScore}/100`, 940, 82);
          exportCtx.textAlign = 'left';

          function drawPanel(canvas, x, label) {
            exportCtx.fillStyle = '#bac2de';
            exportCtx.font = '700 22px "Trebuchet MS", sans-serif';
            exportCtx.fillText(label, x, imageY - 22);
            exportCtx.fillStyle = '#fff';
            exportCtx.fillRect(x, imageY, imageSize, imageSize);

            const scale = Math.min(imageSize / canvas.width, imageSize / canvas.height);
            const width = canvas.width * scale;
            const height = canvas.height * scale;
            const offsetX = x + (imageSize - width) / 2;
            const offsetY = imageY + (imageSize - height) / 2;
            exportCtx.drawImage(canvas, offsetX, offsetY, width, height);
            exportCtx.strokeStyle = '#45475a';
            exportCtx.lineWidth = 4;
            exportCtx.strokeRect(x, imageY, imageSize, imageSize);
          }

          drawPanel(targetCanvas, 60, 'TARGET');
          drawPanel(drawCanvas, 560, 'YOUR DRAWING');
          exportCtx.font = '18px "Trebuchet MS", sans-serif';
          exportCtx.fillStyle = '#89b4fa';
          exportCtx.fillText('676141.xyz/speedpaint', 60, 610);

          exportCanvas.toBlob((blob) => {
            if (!blob) return;
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `speedpaint-${lastScore}.png`;
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
          }, 'image/png');
        }

        imageUpload.addEventListener('change', () => {
          const file = imageUpload.files && imageUpload.files[0];
          if (!file) {
            return;
          }

          const src = URL.createObjectURL(file);
          const image = new Image();
          image.onload = () => {
            prepareCanvases(image);
            URL.revokeObjectURL(src);
          };
          image.onerror = () => {
            statusElement.textContent = 'Image failed to load. Pick a different image.';
            URL.revokeObjectURL(src);
          };

          image.src = src;
        });

        sharePaintButton.addEventListener('click', shareScore);
        clearPaintButton.addEventListener('click', () => {
          if (gameActive && timerFrame) {
            cancelAnimationFrame(timerFrame);
            timerFrame = null;
          }

          gameActive = false;
          roundArmed = imageReady;
          isDrawing = false;
          lastScore = null;
          clearCanvas();
          statusElement.textContent = 'Canvas cleared. Start drawing when ready.';
          scoreElement.textContent = '--';
          timerElement.textContent = '3.00';
          sharePaintButton.disabled = true;
          setBoardInteractivity(imageReady);
        });

        drawCanvas.addEventListener('pointerdown', drawStart);
        drawCanvas.addEventListener('pointermove', drawMove);
        drawCanvas.addEventListener('pointerup', drawEnd);
        drawCanvas.addEventListener('pointerleave', drawEnd);
        drawCanvas.addEventListener('pointercancel', drawEnd);
        drawCanvas.addEventListener('contextmenu', (event) => event.preventDefault());

        clearCanvas();
        setBoardInteractivity(false);
      })();
    </script>
  </body>
</html>
